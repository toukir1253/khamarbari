<style>
/* Layout: full-screen 3D canvas, glass overlays: caption top-left, controls top-right, floor selector right, zone dock bottom */
:root{--bg:#0d1a13;--panel:rgba(12,24,18,.74);--line:rgba(255,255,255,.16);--fg:#f4f7ef;--mute:#b6c6b8;--accent:#f0b84a;--leaf:#86d492;--font:'Hind Siliguri','Noto Sans Bengali','Segoe UI',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0}

#stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

#cap{position:absolute;left:12px;top:12px;max-width:min(420px,calc(100% - 24px));padding:10px 14px 12px;border-radius:14px}

.plan{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--bg);color:var(--fg);padding:14px 14px 40px;font:500 14px/1.5 var(--font)}

<script>
/* ===== সাধারণ সহায়ক (থ্রিডি ছাড়াই চলে) ===== */
window.bn=function(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d];});};
window.fmtN=function(n){return window.bn(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','));};
window.el=function(tag,props,kids){var e=document.createElement(tag);if(props)for(var k in props){if(k==='text')e.textContent=props[k];else if(k==='cls')e.className=props[k];else e.setAttribute(k,props[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;};
window.store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ===== খামারের মাপ ও জমির হিসাব: ১ ইউনিট = ১ মিটার ===== */
window.FARM=(function(){
 var W={x0:-80,x1:80,z0:-48,z1:42},GX=46,BIGHA=1440;            // ১৬০ মি × ৯০ মি = ১৪,৪০০ বর্গমিটার = ১০ বিঘা
 var P={cx:-42,cz:-13.2,a:37.3,b:34.5,n:8};                      // পুকুরের আকার: গোল-কোণা আয়তক্ষেত্র
 function pt(t,sc){var c=Math.cos(t),s=Math.sin(t);return [P.cx+(c<0?-1:1)*Math.pow(Math.abs(c),2/P.n)*P.a*sc,P.cz+(s<0?-1:1)*Math.pow(Math.abs(s),2/P.n)*P.b*sc];}
 function outline(N,sc){var o=[];for(var i=0;i<N;i++)o.push(pt(i/N*Math.PI*2,sc||1));return o;}
 function area(p){var A=0;for(var i=0;i<p.length;i++){var q=p[(i+1)%p.length];A+=p[i][0]*q[1]-q[0]*p[i][1];}return Math.abs(A)/2;}
 P.b=P.b*(3.5*BIGHA)/area(outline(1440,1));                       // পুকুর ঠিক ৩.৫ বিঘা হওয়ার মতো করে মেলানো
 var MANGO={x0:-3.65,x1:14.81,z0:-48,z1:30},NAPIER={x0:14.81,x1:42.5,z0:-48,z1:30};
 var ra=function(r){return (r.x1-r.x0)*(r.z1-r.z0);};
 var rows=[
  {k:'pond',n:'পুকুর (জলাশয়)',bigha:3.5,c:'#3aa0b8',drawn:area(outline(1440,1))},
  {k:'grass',n:'ঘাস চাষের জমি (নেপিয়ার)',bigha:1.5,c:'#8aa84a',drawn:ra(NAPIER)},
  {k:'mango',n:'হিমসাগর আম বাগান',bigha:1.0,c:'#5a9a45',drawn:ra(MANGO)},
  {k:'live',n:'গরু, ছাগল ও মুরগির খামার',bigha:1.3,c:'#c9955a'},
  {k:'mill',n:'তেল ও ঘিয়ের মিল ও উঠান',bigha:0.6,c:'#d9a23a'},
  {k:'house',n:'ডুপ্লেক্স, অফিস ও গোডাউন',bigha:1.2,c:'#e0b84a'},
  {k:'gate',n:'প্রবেশপথ, সড়ক ও সবুজায়ন',bigha:0.9,c:'#9a9a94'}];
 rows.forEach(function(r){r.m2=r.bigha*BIGHA;});
 return {W:W,GX:GX,BIGHA:BIGHA,POND:P,pondPt:pt,pondOutline:outline,MANGO:MANGO,NAPIER:NAPIER,rows:rows,
  totalBigha:rows.reduce(function(s,r){return s+r.bigha;},0),totalM2:(W.x1-W.x0)*(W.z1-W.z0),
  COW:100,GOAT:200,HEN:10000};
})();

/* ===== ২ডি ম্যাপ ও হিসাব: থ্রিডি না চললে বা নেট না থাকলে এটাই দেখায় ===== */
window.showPlan2D=function(note){
 var F=window.FARM,W=F.W,old=document.getElementById('plan2d');if(old)old.remove();
 var root=el('div',{id:'plan2d',cls:'plan'});
 var ok=!!window.__3dOk;
 var btn=el('button',{type:'button',cls:'btn on',text:ok?'← ৩ডি দৃশ্যে ফিরুন':'↻ আবার চেষ্টা করুন'});
 btn.addEventListener('click',function(){if(ok)root.remove();else location.reload();});
 root.appendChild(el('div',{cls:'planhead'},[el('h1',{text:'১০ বিঘা সমন্বিত খামার: ২ডি ম্যাপ ও হিসাব'}),btn]));
 if(note)root.appendChild(el('p',{cls:'plannote',text:note}));
 var NS='http://www.w3.org/2000/svg',pad=5;
 var svg=document.createElementNS(NS,'svg');
 svg.setAttribute('viewBox',(W.x0-pad)+' '+(W.z0-pad)+' '+(W.x1-W.x0+2*pad)+' '+(W.z1-W.z0+2*pad+9));
 svg.setAttribute('role','img');svg.setAttribute('aria-label','খামারের ২ডি ম্যাপ। ১ ইউনিট = ১ মিটার');
 function S(tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
 function R(x0,x1,z0,z1,fill,op,stroke){return S('rect',{x:x0,y:z0,width:x1-x0,height:z1-z0,fill:fill,opacity:op||1,stroke:stroke||'none','stroke-width':0.35,rx:0.6});}
 function T(x,z,s,size,fill){var t=S('text',{x:x,y:z,'font-size':size||3,fill:fill||'#fff','text-anchor':'middle','font-family':'Hind Siliguri,Noto Sans Bengali,sans-serif','font-weight':600});t.textContent=s;return t;}
 R(W.x0,W.x1,W.z0,W.z1,'#86b35a');
 var po=F.pondOutline(240,1).map(function(p){return p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ');
 S('polygon',{points:po,fill:'#2a86c9',stroke:'#9cc468','stroke-width':0.7});
 R(F.MANGO.x0,F.MANGO.x1,F.MANGO.z0,F.MANGO.z1,'#5a9a45',0.95,'#2d6a2b');
 R(F.NAPIER.x0,F.NAPIER.x1,F.NAPIER.z0,F.NAPIER.z1,'#8aa84a',0.95,'#5d7a2a');
 R(F.GX-3.5,F.GX+3.5,W.z0,W.z1+14,'#8e8b84');R(F.GX+3.5,W.x1,9,12,'#8e8b84');
 R(54,78,18,36,'#d9a23a',1,'#7a4b12');R(54,78,-15,8,'#c9955a',1,'#7a4b12');R(53,79,-30,-18,'#a4b88a',1,'#4a5d3a');R(54,76,-46,-33,'#b89a7a',1,'#5a4630');
 R(-76,-40,23,39,'#e0b84a',1,'#7a5a1a');R(-34,-6,22.5,30.5,'#bdb7a8',1,'#6b6a64');
 S('circle',{cx:-30,cy:5,r:3.6,fill:'#c9a35a',stroke:'#7a5a3a','stroke-width':0.4});

function leafGeo(len,w,droop,seg){

  for(let i=0;i<=seg;i++){const t=i/seg,x=t*len,y=-droop*t*t*len*0.5,ww=w*Math.sin(Math.min(1,0.25+t*0.9)*PI*0.9)*(1-0.55*t)+0.02;
    pos.push(x,y+0.05*ww,-ww, x,y+0.09,0, x,y+0.05*ww,ww);}
  for(let i=0;i<seg;i++){const a=i*3;idx.push(a,a+3,a+1,a+1,a+3,a+4,a+1,a+4,a+2,a+2,a+4,a+5);}

function palmGeo(o){
  const m=new Merger(),N=7;const P=t=>[o.bend*t*t,o.H*t];
  for(let i=0;i<N;i++){const a=P(i/N),b=P((i+1)/N),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
    const r0=o.tr0+(o.tr1-o.tr0)*i/N,r1=o.tr0+(o.tr1-o.tr0)*(i+1)/N;
    m.add(new T.CylinderGeometry(r1,r0,L*1.02,7),i%2?o.tc1:o.tc0,mx((a[0]+b[0])/2,(a[1]+b[1])/2,0,0,0,-Math.atan2(dx,dy)));}
  const top=P(1);
  if(o.shaft)m.add(new T.CylinderGeometry(o.tr1*1.1,o.tr1*0.9,1.1,7),o.shaft,mx(top[0],top[1]+0.45,0));
  const lg=leafGeo(o.flen,o.fw,o.droop,8);
  for(let i=0;i<o.fronds;i++){const ry=i/o.fronds*PI*2+R(-0.2,0.2),lift=R(0.1,0.7)-(i%2?0.25:0);
    m.add(lg,i%2?o.fc0:o.fc1,mx(top[0],top[1]+0.6,0,0,ry,lift,R(0.88,1.1),1,1));}
  for(let i=0;i<o.nuts;i++){const a=i/o.nuts*PI*2;
    m.add(new T.IcosahedronGeometry(o.nr,0),i%3===2?o.nc1:o.nc0,mx(top[0]+Math.cos(a)*o.nr*1.5,top[1]-0.15-R(0,0.4),Math.sin(a)*o.nr*1.5));}

function coconutGeo(){
  const m=new Merger(),H=12.6,bend=2.8,N=14;const P=t=>[bend*t*t,H*t];
  for(let i=0;i<N;i++){const a=P(i/N),b=P((i+1)/N),t0=i/N,t1=(i+1)/N;
    limb(m,i%2?0x8a7a66:0x766754,a[0],a[1],0,b[0],b[1],0,0.19+0.24*Math.pow(1-t0,3),0.19+0.24*Math.pow(1-t1,3),7);}
  const top=P(1);
  ell(m,0x7f9a47,top[0],top[1]+0.15,0,0.3,0.55,0.3);
  const frond=(ry,elev,len,droop,k)=>{
    const cs=Math.cos(ry),sn=Math.sin(ry);
    const xf=p=>[top[0]+p[0]*cs+p[2]*sn,top[1]+0.45+p[1],p[2]*cs-p[0]*sn];
    const Q=t=>[len*t,len*(elev*t-droop*t*t),0];
    const greens=[0x3f8a3a,0x4b9b42,0x56a84a,0x3a7d35];
    let prev=Q(0);
    for(let s=1;s<=8;s++){const c=Q(s/8),a=xf(prev),b=xf(c);limb(m,0x7d8d3e,a[0],a[1],a[2],b[0],b[1],b[2],0.05*(1-(s-1)/9),0.05*(1-s/9),4);prev=c;}
    const step=LITE?0.1:0.065;
    for(let t=0.14;t<1;t+=step){
      const b0=Q(t),b1=Q(t+0.03),tx=b1[0]-b0[0],ty=b1[1]-b0[1],tl=Math.hypot(tx,ty)||1,ux=tx/tl,uy=ty/tl;
      const L=(1.5*Math.sin(Math.PI*(0.12+0.85*t))+0.25)*(0.85+0.3*rand());
      for(const sd of [-1,1]){
        const dx=ux*0.45+0*1,dy=uy*0.45-0.75,dz=sd*0.85,dl=Math.hypot(dx,dy,dz);
        const tip=[b0[0]+dx/dl*L,b0[1]+dy/dl*L,b0[2]+dz/dl*L],w=0.13;
        m.tri(greens[(k+Math.round(t*20))%4],xf([b0[0]-ux*w,b0[1]-uy*w,b0[2]]),xf([b0[0]+ux*w,b0[1]+uy*w,b0[2]]),xf(tip));}}
  };
  const NF=LITE?11:16;
  for(let i=0;i<NF;i++){const lvl=i%4;frond(i/NF*PI*2+R(-0.2,0.2),[1.1,0.75,0.45,0.2][lvl],[4.6,5.4,5.8,5.2][lvl],[1.0,1.15,1.3,1.5][lvl],i);}
  // ডাবের কাঁদি: সবুজ ও কয়েকটা পাকা নারিকেল
  for(let i=0;i<10;i++){const a=i/10*PI*2,r=0.34+R(0,0.12);
    ell(m,i%4===3?0x8b5a2b:(i%2?0x9fb34c:0xb8c45e),top[0]+Math.cos(a)*r,top[1]-0.25-R(0,0.45),Math.sin(a)*r,0.17,0.2,0.17,R(-0.3,0.3),0,R(-0.3,0.3));}
  return {geo:m.build(),top,H};}

function mangoGeo(){
  const m=new Merger();
  limb(m,0x6e5236,0,0,0,0.05,2.5,0,0.5,0.32,8);
  [[1.1,0.4],[-1.0,0.6],[0.2,-1.2],[-0.4,1.1]].forEach(b=>limb(m,0x6a4f35,0,2.1,0,b[0]*1.5,3.7,b[1]*1.5,0.2,0.11,6));
  const cols=[0x2d6a2b,0x38792f,0x275d27,0x3f8434,0x2f6e2e,0x4a8f3a];
  const B=[[0,5.5,0,2.9]];
  for(let i=0;i<9;i++){const a=i/9*PI*2;B.push([Math.cos(a)*2.6,4.9+(i%3)*0.3,Math.sin(a)*2.6,2.1]);}
  for(let i=0;i<6;i++){const a=i/6*PI*2+0.4;B.push([Math.cos(a)*1.4,6.6+(i%2)*0.3,Math.sin(a)*1.4,1.9]);}
  for(let i=0;i<8;i++){const a=i/8*PI*2+0.2;B.push([Math.cos(a)*3.2,4.1,Math.sin(a)*3.2,1.5]);}
  B.forEach((b,i)=>ell(m,cols[i%6],b[0],b[1],b[2],b[3],b[3]*0.82,b[3],0,i,0));
  const fc=[0xc3d15a,0xb3c94d,0xd8cf5c,0xa9c446,0xe0b84a];
  const lower=B.slice(16);
  for(let i=0;i<(LITE?18:34);i++){const b=lower[i%lower.length],th=R(0,6.28),ph=R(0.9,1.45);
    const px=b[0]+Math.cos(th)*Math.sin(ph)*b[3]*0.9,py=b[1]-Math.cos(ph)*b[3]*0.75-0.1,pz=b[2]+Math.sin(th)*Math.sin(ph)*b[3]*0.9;

    ell(m,pick(fc),px,py-0.5,pz,0.12,0.22,0.1,R(-0.2,0.2),0,R(-0.2,0.2));}
  return m.build();}

function applyQuality(level){
  if(level===qual)return;qual=level;
  const sh=level<2;renderer.shadowMap.enabled=sh;sun.castShadow=sh;
  renderer.shadowMap.type=level===0?T.PCFSoftShadowMap:T.BasicShadowMap;
  const sz=level===0?2048:1024;if(sun.shadow.mapSize.x!==sz){sun.shadow.mapSize.set(sz,sz);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,level===0?2:level===1?1.25:1));
  if(henIM)henIM.count=level===0?scene.userData.henCount:Math.floor(scene.userData.henCount*(level===1?0.5:0.3));
  clouds.forEach((c,i)=>{c.visible=level===0||i%2===0;});
  scene.traverse(o=>{if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.needsUpdate=true;});});
  resize();
  if(swInputs.lite)swInputs.lite.checked=level>=1;}
function applyToggle(k,v){

  else if(k==='caption')document.getElementById('cap').style.display=v?'':'none';
  else if(k==='legend'){legend.classList.toggle('show',v);zoneOv.visible=v;}
  else if(k==='flow'){flowG.visible=v;document.getElementById('flowKey').classList.toggle('show',v);}
  else if(k==='walls')wallG.visible=v;
  else if(k==='roof'){roofHide=!v;roofs.forEach(r=>{r.visible=v;});}
  else if(k==='time')document.getElementById('tm').style.display=v?'':'none';
  else if(k==='chips')document.getElementById('chips').style.display=v?'':'none';
  else if(k==='scale')document.getElementById('scaleNote').style.display=v?'':'none';
  else if(k==='lite')applyQuality(v?1:0);}
function setToggle(k,v,persist){SET[k]=v;if(swInputs[k])swInputs[k].checked=v;applyToggle(k,v);

function field(label,id,type='text',placeholder='',value=''){return '<label>'+label+'<input id="'+id+'" type="'+type+'" placeholder="'+placeholder+'" value="'+safe(value)+'"></label>'}
function select(label,id,opts){return '<label>'+label+'<select id="'+id+'">'+opts.map(x=>'<option>'+safe(x)+'</option>').join('')+'</select></label>'}
function listLogs(type){return db.logs.filter(x=>!type||x.type===type).slice().reverse().map(x=>'<div class="fmItem"><b>'+safe(x.date)+' · '+safe(x.title)+'</b><div>'+safe(x.qty||'')+' '+safe(x.unit||'')+' · '+money(x.amount)+'</div><div class="fmMuted">'+safe(x.note||'')+'</div></div>').join('')||'<p class="fmMuted">এখনো কোনো তথ্য যোগ করা হয়নি।</p>'}
function render(t){
 tabActive(t);let html='';
 if(t==='home'){
  const sales=db.logs.filter(x=>x.type==='sale').reduce((a,x)=>a+x.amount,0),cost=db.logs.filter(x=>x.type==='cost'||x.type==='purchase').reduce((a,x)=>a+x.amount,0),prod=db.logs.filter(x=>x.type==='production').length;
  html='<h2>খামারের পরিচালনা সারসংক্ষেপ</h2><div class="fmGrid"><div class="fmStat">নথিভুক্ত বিক্রি<b>'+money(sales)+'</b></div><div class="fmStat">নথিভুক্ত খরচ<b>'+money(cost)+'</b></div><div class="fmStat">উৎপাদন এন্ট্রি<b>'+prod+'</b></div><div class="fmStat">স্টক আইটেম<b>'+db.stocks.length+'</b></div></div><div class="fmCard"><b>ব্যবহার শুরু</b><p class="fmMuted">প্রতিদিনের কাজ টিক দাও, খাদ্য/স্বাস্থ্য রেকর্ড রাখো, উৎপাদন ও বিক্রির তথ্য যোগ করো। এই তথ্য এই ডিভাইসের ব্রাউজারে সেভ থাকবে।</p><p class="fmMuted">গুরুত্বপূর্ণ: পশুর ওষুধ/টিকার নির্দিষ্ট ডোজ এখানে স্বয়ংক্রিয়ভাবে নির্ধারণ করা হয় না। প্রাণীর ধরন, বয়স ও ওজন অনুযায়ী ভেটেরিনারিয়ানের পরামর্শ নাও।</p></div><div class="fmCard"><h3>সাম্প্রতিক নথি</h3>'+listLogs()+'</div>';
 }else if(t==='routine'){
  const tasks=['সকালে সব প্রাণীর স্বাস্থ্য ও আচরণ পর্যবেক্ষণ','পরিষ্কার পানি ও খাবার সরবরাহ','গরু-ছাগলের শেড পরিষ্কার ও শুকনো রাখা','মুরগির ঘর, বাতাস চলাচল ও ডিম সংগ্রহ পরীক্ষা','পুকুরের পানি, মাছের আচরণ ও খাবার পর্যবেক্ষণ','ঘাস/ফসলের জমি ও সেচ পরীক্ষা','খাদ্য, ডিম, দুধ ও উৎপাদনের হিসাব লেখা','সন্ধ্যায় পুনরায় প্রাণী ও নিরাপত্তা পরীক্ষা'];
  html='<h2>দৈনিক কাজের রুটিন</h2><div class="fmCard"><p>'+today()+' — প্রতিটি কাজ শেষ হলে টিক দাও।</p>'+tasks.map((x,i)=>'<label><input type="checkbox" data-check="'+i+'" style="width:auto;margin-right:8px" '+(db.checks[today()+'-'+i]?'checked':'')+'>'+x+'</label>').join('<hr style="border-color:#34513a">')+'<p class="fmMuted">টিকগুলো এই ডিভাইসে সংরক্ষিত হবে।</p></div>';
 }else if(t==='care'){
  html='<h2>খাদ্য ও স্বাস্থ্য রেকর্ড</h2><div class="fmCard">'+select('প্রাণী/বিভাগ','cAnimal',['গরু','ছাগল','মুরগি','মাছ','ঘাস/ফসল','অন্যান্য'])+select('রেকর্ডের ধরন','cType',['খাদ্য সরবরাহ','টিকা','কৃমিনাশক','চিকিৎসা','স্বাস্থ্য পর্যবেক্ষণ','পরিষ্কার-পরিচ্ছন্নতা'])+field('তারিখ','cDate','date','',today())+field('পরিমাণ/বিবরণ','cQty','text','যেমন: ২০ কেজি / লক্ষণ')+field('পরবর্তী করণীয়/তারিখ','cNext','text','প্রয়োজনে লিখুন')+'<label>নোট<textarea id="cNote" rows="2"></textarea></label><button id="cAdd">রেকর্ড সংরক্ষণ</button></div><div class="fmCard"><h3>সাম্প্রতিক রেকর্ড</h3>'+db.care.slice().reverse().map(x=>'<div class="fmItem"><b>'+safe(x.date)+' · '+safe(x.animal)+' · '+safe(x.type)+'</b><div>'+safe(x.qty)+' · পরবর্তী: '+safe(x.next)+'</div><div class="fmMuted">'+safe(x.note)+'</div></div>').join('')+'</div>';
 }else if(t==='production'){
  html='<h2>উৎপাদন ও বিক্রির হিসাব</h2><div class="fmCard">'+select('ধরন','pType',['production','sale','cost'])+select('খাত','pTitle',['দুধ','ডিম','গরু','ছাগল','মাছ','ঘাস','আম','সরিষার তেল','নারিকেল তেল','ঘি','খাদ্য','ওষুধ','শ্রমিক','পরিবহন','অন্যান্য'])+field('তারিখ','pDate','date','',today())+field('পরিমাণ','pQty','number','0')+field('একক','pUnit','text','কেজি/লিটার/টি')+field('মোট টাকা','pAmount','number','0')+'<label>বিবরণ<textarea id="pNote" rows="2"></textarea></label><button id="pAdd">হিসাব যোগ করো</button></div><div class="fmCard"><h3>সাম্প্রতিক হিসাব</h3>'+listLogs()+'</div>';
 }else if(t==='stock'){
  html='<h2>স্টক ও ক্রয় ব্যবস্থাপনা</h2><div class="fmCard">'+field('পণ্যের নাম','sName','text','যেমন: গরুর খাদ্য')+select('ক্যাটাগরি','sCat',['খাদ্য','ওষুধ','বীজ/পোনা','সার','জ্বালানি','অন্যান্য'])+field('বর্তমান মজুত','sQty','number','0')+field('একক','sUnit','text','কেজি/বস্তা/লিটার')+field('সতর্কতা সীমা','sMin','number','0')+field('ক্রয়মূল্য (মোট)','sCost','number','0')+'<button id="sAdd">স্টক যোগ/আপডেট</button></div><div class="fmCard"><h3>মজুত তালিকা</h3>'+ (db.stocks.map((x,i)=>'<div class="fmItem"><b>'+safe(x.name)+'</b> · '+safe(x.cat)+'<div>মজুত: '+x.qty+' '+safe(x.unit)+' · সতর্কতা সীমা: '+x.min+' · ক্রয়মূল্য: '+money(x.cost)+'</div>'+(x.qty<=x.min?'<b style="color:#ffb18e">⚠ মজুত কম</b>':'')+' <button class="fmDanger" data-delstock="'+i+'">মুছুন</button></div>').join('')||'<p class="fmMuted">স্টক যোগ করা হয়নি।</p>')+'</div>';
 }else if(t==='season'){
  html='<h2>মৌসুমভিত্তিক ব্যবস্থাপনা</h2><div class="fmCard"><h3>গ্রীষ্মকাল</h3><ul><li>প্রাণীর জন্য পর্যাপ্ত পরিষ্কার পানি ও ছায়া নিশ্চিত করো।</li><li>গরমের সময় শেডে বাতাস চলাচল ও তাপের চাপ পর্যবেক্ষণ করো।</li><li>পুকুরে ভোরে মাছের আচরণ ও পানির অবস্থা দেখো; অস্বাভাবিকতা হলে বিশেষজ্ঞের পরামর্শ নাও।</li><li>ঘাস ও ফসলে প্রয়োজন অনুযায়ী সেচ দাও।</li></ul></div><div class="fmCard"><h3>বর্ষাকাল</h3><ul><li>শেড, খাদ্যগুদাম ও বৈদ্যুতিক সংযোগ শুকনো ও নিরাপদ রাখো।</li><li>পানি জমা, নোংরা পানি ও রোগ ছড়ানোর ঝুঁকি কমাও।</li><li>পুকুরের পাড়, পানি উপচে পড়া ও ইনলেট-আউটলেট পরীক্ষা করো।</li><li>ভেজা খাদ্য ও ছত্রাকযুক্ত খাবার ব্যবহার কোরো না।</li></ul></div><div class="fmCard"><h3>শীতকাল</h3><ul><li>বাচ্চা ও দুর্বল প্রাণীর ঠান্ডা/বাতাস থেকে সুরক্ষা নিশ্চিত করো।</li><li>শেডে বাতাস চলাচল রাখো, তবে সরাসরি ঠান্ডা বাতাসের ধাক্কা এড়াও।</li><li>পুকুরে খাবার গ্রহণ ও মাছের আচরণ দেখে ব্যবস্থাপনা সমন্বয় করো।</li><li>ফসল ও ঘাসের জমিতে পানি নিষ্কাশন ও পরিচর্যা করো।</li></ul></div><p class="fmMuted">এগুলো সাধারণ ব্যবস্থাপনা নির্দেশনা; স্থানীয় আবহাওয়া, জাত ও খামারের বাস্তব অবস্থা অনুযায়ী কৃষি/প্রাণিসম্পদ কর্মকর্তার পরামর্শ নাও।</p>';
 }else if(t==='reports'){
  const month=today().slice(0,7), rows=db.logs.filter(x=>(x.date||'').slice(0,7)===month),sum=k=>rows.filter(x=>x.type===k).reduce((a,x)=>a+x.amount,0),prod=rows.filter(x=>x.type==='production').length;
  html='<h2>মাসিক রিপোর্ট · '+month+'</h2><div class="fmGrid"><div class="fmStat">বিক্রি<b>'+money(sum('sale'))+'</b></div><div class="fmStat">খরচ/ক্রয়<b>'+money(sum('cost')+sum('purchase'))+'</b></div><div class="fmStat">নথিভুক্ত উৎপাদন<b>'+prod+'</b></div><div class="fmStat">নেট নগদ প্রবাহ<b>'+money(sum('sale')-sum('cost')-sum('purchase'))+'</b></div></div><div class="fmCard"><h3>এই মাসের লেনদেন</h3>'+rows.slice().reverse().map(x=>'<div class="fmItem">'+safe(x.date)+' · '+safe(x.title)+' · '+safe(x.type)+'<b style="float:right">'+money(x.amount)+'</b><div class="fmMuted">'+safe(x.qty)+' '+safe(x.unit)+' '+safe(x.note)+'</div></div>').join('')+'</div><button id="fmCsv">CSV রিপোর্ট ডাউনলোড</button><p class="fmMuted">রিপোর্টে শুধু এই ম্যানেজমেন্ট মডিউলে যোগ করা তথ্য ধরা হয়েছে; ড্যাশবোর্ডের পুরোনো ইনপুট এতে মেশানো হয়নি।</p>';
 }
 content.innerHTML=html;
 content.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{db.checks[today()+'-'+el.dataset.check]=el.checked;save()}));
 const on=(id,fn)=>{const el=content.querySelector('#'+id);if(el)el.addEventListener('click',fn)};
 on('cAdd',()=>{db.care.push({animal:$('#cAnimal').value,type:$('#cType').value,date:$('#cDate').value,qty:$('#cQty').value,next:$('#cNext').value,note:$('#cNote').value});save();render('care')});
 on('pAdd',()=>{db.logs.push({type:$('#pType').value,title:$('#pTitle').value,date:$('#pDate').value,qty:Number($('#pQty').value)||0,unit:$('#pUnit').value,amount:Number($('#pAmount').value)||0,note:$('#pNote').value});save();render('production')});
 on('sAdd',()=>{let name=$('#sName').value.trim();if(!name){alert('পণ্যের নাম লিখুন');return}let item={name,cat:$('#sCat').value,qty:Number($('#sQty').value)||0,unit:$('#sUnit').value,min:Number($('#sMin').value)||0,cost:Number($('#sCost').value)||0};let old=db.stocks.find(x=>x.name.toLowerCase()===name.toLowerCase());if(old)Object.assign(old,item);else db.stocks.push(item);save();render('stock')});
 content.querySelectorAll('[data-delstock]').forEach(b=>b.addEventListener('click',()=>{db.stocks.splice(Number(b.dataset.delstock),1);save();render('stock')}));
 on('fmCsv',()=>{const rows=[['তারিখ','ধরন','খাত','পরিমাণ','একক','টাকা','বিবরণ'],...db.logs.map(x=>[x.date,x.type,x.title,x.qty,x.unit,x.amount,x.note])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='khamarbari-report.csv';a.click();URL.revokeObjectURL(a.href)});
}
})();
</script>

</body></html>
