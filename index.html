<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">  <link rel="stylesheet" href="./style.css?v=1">
</head><body>
<title>১০ বিঘা সমন্বিত খামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<canvas id="c" aria-label="১০ বিঘা সমন্বিত খামারের ৩ডি দৃশ্য"></canvas>
<div id="labels"></div>
<div id="cap" class="glass"><div class="k" id="capk"></div><h1 id="capt">১০ বিঘা সমন্বিত খামার</h1><p id="capp"></p><div id="stats"><span>🐄 <b data-n="100">০</b> গরু</span><span>🐐 <b data-n="200">০</b> ছাগল</span><span>🐔 <b data-n="10000">০</b> মুরগি</span><span>🐟 <b data-n="3.5">০</b> বিঘা পুকুর</span></div></div>
<div id="tl">
  <div style="display:flex;gap:8px"><button class="btn" id="farmMgmtBtn" type="button" title="খামার পরিচালনা" aria-label="খামার পরিচালনা">🗂️</button><button class="btn" id="guideBtn" type="button">🚶 গাইড</button><button class="btn on" id="play" type="button">⏸ ট্যুর থামান</button><button class="btn" id="menuBtn" type="button" aria-label="আরও অপশন">⚙</button></div>
  <div id="more" class="glass"></div>
</div>
<div id="floors" class="glass"><small>ভবনের তলা</small>
  <button class="btn" id="flClose" type="button" aria-label="বন্ধ করুন" style="border-radius:10px;padding:5px 12px">✕ বন্ধ করুন</button>
  <button class="btn" data-f="3" type="button">ছাদ</button>
  <button class="btn" data-f="2" type="button">২য় তল</button>
  <button class="btn" data-f="1" type="button">১ম তল</button>
  <button class="btn" data-f="0" type="button">নিচতলা</button>
  <button class="btn on" data-f="all" type="button">সব তলা</button>
</div>
<div id="legend" class="glass"></div>
<div id="scaleNote" class="glass">📏 স্কেল: <b>১ ইউনিট = ১ মিটার</b> · জমি ১৬০ মি × ৯০ মি = ১৪,৪০০ ব.মি. (১০ বিঘা)</div>
<div id="toast" class="glass" hidden></div>
<div id="flowKey" class="glass"><span style="color:#5ab6ff">● 💧 পানি</span><span style="color:#8fd460">● 🌿 ঘাস</span><span style="color:#c98a52">● 🐄 গোবর</span><span style="color:#ffd24a">● ⚡ গ্যাস ও বিদ্যুৎ</span></div>
<div id="dock">
  <div id="tm" class="glass"><span id="tmIcon">☀</span><input id="tmR" type="range" min="0" max="24" step="0.05" value="10.5" aria-label="দিনের সময়"><output id="tmO"></output><button class="btn" id="tmAuto" type="button" style="padding:3px 10px">দিন-রাত চালান</button></div>
  <div id="chips"></div>
</div>
<div id="recbar" class="glass" hidden><span id="recmsg"></span><button class="btn on" id="recgo" type="button" hidden></button><button class="btn" id="reccancel" type="button">বাতিল</button></div>
<div id="load">খামার সাজানো হচ্ছে…</div>
<script src="./js/boot.js?v=1"></script>
<script src="./js/scene.js?v=1"></script>



<div id="bizPanel" aria-live="polite">
 <div class="bpHead"><b id="bpTitle">খামারের ব্যবসায়িক তথ্য</b><button id="bpClose">✕ বন্ধ</button></div>
 <div id="bpContent"></div>
</div>
<script src="./js/farm-business.js?v=1"></script>



<script src="./js/animal-ui.js?v=1"></script>



<div id="fmPanel" aria-live="polite">
 <div class="fmHead"><b>খামার পরিচালনা কেন্দ্র</b><button id="fmClose">✕ বন্ধ</button></div>
 <div class="fmTabs" id="fmTabs">
  <button data-tab="home" class="active">সারসংক্ষেপ</button><button data-tab="finance">আয়-ব্যয়ের হিসাব</button><button data-tab="routine">দৈনিক রুটিন</button><button data-tab="care">খাদ্য ও স্বাস্থ্য</button><button data-tab="production">উৎপাদন/বিক্রি</button><button data-tab="stock">স্টক/ক্রয়</button><button data-tab="season">মৌসুম</button><button data-tab="reports">রিপোর্ট</button>
 </div>
 <div id="fmContent"></div>
</div>
<script src="./js/farm-management.js?v=1"></script>

</body></html>
